        //
        // Earth starting position relative to the Sun (200px offset)
        let sunX=400, sunY=400;
    let x = 200;
    let y = 0;

    // Small rotation angle per frame (~1.14 degrees for smooth motion)
    const angle = Math.PI / 150; 
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    function loop() {
      // 1. Clear the canvas buffer
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Draw the Sun inside the loop so it persists!
      ctx.beginPath();
      ctx.arc(sunX, sunY, 100, 0, Math.PI * 2, true);
      ctx.strokeStyle = "orange";
      ctx.fillStyle = "yellow";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fill();

      ctx.save();
      ctx.font = "bold 28px Arial";
      ctx.fillStyle = "red";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText("SUN", sunX, sunY);
      ctx.restore();

      // 3. Apply Matrix Rotation using simultaneous destructuring
      [x, y] = [
        (x * cos) - (y * sin),
        (x * sin) + (y * cos)
      ];

      // 4. Translate relative coordinates (x, y) to Sun origin (sunX, sunY)
      const drawX = sunX + x;
      const drawY = sunY + y;

      // 5. Draw the Earth
      ctx.beginPath();
      ctx.arc(drawX, drawY, 40, 0, Math.PI * 2, true);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "lightblue";
      ctx.fillStyle = "blue";
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.font = "bold 15px Arial";
      ctx.fillStyle = "white";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText("Earth", drawX, drawY);
      ctx.restore();

      // 6. Request next frame
      requestAnimationFrame(loop);
    }

    // Kick off the loop
    requestAnimationFrame(loop);
