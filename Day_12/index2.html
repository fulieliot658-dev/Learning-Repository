<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathChat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        padding-top: 30px;
      }

      .chat-container {
        width: 400px;
        background: #ffffff;
        padding: 15px;
        border: 2px solid #90caf9;
        box-shadow: inset 3px 3px 6px #bbdefb, inset -3px -3px 6px #e3f2fd, 4px 4px 0px #90caf9, 8px 8px 0px #e3f2fd;
        border-radius: 8px;
      }

      .welcome {
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
        color: #1976d2;
      }

      #chat-area {
        height: 300px;
        border: 1px solid #90caf9;
        box-shadow: inset 2px 2px 4px #e3f2fd, inset -2px -2px 4px #ffffff;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 10px;
        background-color: #fafafa;
      }

      .msg {
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        word-wrap: break-word;
      }

      .user-msg {
        color: #1e88e5;
        border: 1px solid #90caf9;
        background-color: #e3f2fd;
        text-align: right;
        box-shadow: inset 1px 1px 3px #bbdefb, inset -1px -1px 3px #ffffff;
      }

      .bot-msg {
        color: #333;
        border: 1px solid #90caf9;
        background-color: #ffffff;
        text-align: left;
        box-shadow: inset 1px 1px 3px #e0e0e0, inset -1px -1px 3px #ffffff;
      }

      .input-area {
        display: flex;
        gap: 5px;
      }

      #input {
        flex: 1;
        padding: 8px;
        border: 1px solid #90caf9;
        border-radius: 4px;
        box-shadow: inset 2px 2px 4px #e3f2fd;
      }

      button {
        padding: 8px 15px;
        background-color: #e3f2fd;
        color: #1565c0;
        border: 1px solid #90caf9;
        box-shadow: inset 1px 1px 2px #ffffff, inset -1px -1px 2px #bbdefb, 2px 2px 0px #90caf9, 4px 4px 0px #e3f2fd;
        cursor: pointer;
        font-weight: bold;
      }

      button:active {
        box-shadow: inset 2px 2px 4px #bbdefb;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <span class="welcome"></span>
      <div id="chat-area"></div>
      <div class="input-area">
        <input type="text" id="input" placeholder="Type your message here..." />
        <button type="submit" onclick="response()">Ask</button>
      </div>
    </div>

    <script>
      const chatArea = document.getElementById("chat-area");
      const message = document.querySelector("#input");
      const welcome = document.querySelector(".welcome");

      const now = new Date();
      welcome.textContent = "MathChat Session - " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let chatHistory = JSON.parse(localStorage.getItem("mathChatHistory")) || [];

      function loadHistory() {
        chatArea.innerHTML = "";
        chatHistory.forEach((item) => {
          appendMessage(item.text, item.sender);
        });
      }

      function appendMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");
        msgDiv.classList.add(sender === "user" ? "user-msg" : "bot-msg");
        msgDiv.textContent = text;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function saveToStorage(text, sender) {
        chatHistory.push({ text: text, sender: sender });
        localStorage.setItem("mathChatHistory", JSON.stringify(chatHistory));
      }

      function generateBotAnswer(userText) {
        const text = userText.toLowerCase().trim();

        if (text.startsWith("binary ") || text.startsWith("bin ")) {
          const num = parseInt(text.split(" ")[1]);
          if (!isNaN(num)) {
            return "Binary of " + num + " is: " + num.toString(2);
          }
          return "Please enter a valid number for binary conversion (e.g., binary 12).";
        }

        if (/^[0-9+\-*/.\s()]+$/.test(text) && text.length > 0) {
          try {
            const mathResult = Function('"use strict";return (' + text + ')')();
            return "Result: " + mathResult;
          } catch (e) {
            return "Could not compute that math expression.";
          }
        }

        if (text.includes("area of circle")) {
          return "Formula: Area = π × r²";
        }
        if (text.includes("pythagorean") || text.includes("pythagoras")) {
          return "Formula: a² + b² = c²";
        }
        if (text.includes("quadratic")) {
          return "Formula: x = (-b ± √(b² - 4ac)) / (2a)";
        }

        if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
          return "Hello! I am MathChat. Ask me for math calculations, binary conversions, or formulas!";
        }

        if (text.includes("story")) {
          return "Once upon a time ([User]: Say ...), the number 0 felt lonely until it met 1. Together, they created the entire digital universe through binary logic throught a guy (Charles babbadge and Ada lovelance) with a fantastic idea of replacing the terrible decimal with true(1) and false(0), thereby creating the mordern standard we all follow!";
        }

        return "I can carry out simple arithmetics, convert binary (e.g., binary 8), give formulas, or tell a story (which is very interesting by the way)!";
      }

      function response() {
        const userText = message.value.trim();
        if (!userText) return;

        appendMessage(userText, "user");
        saveToStorage(userText, "user");

        const botReply = generateBotAnswer(userText);

        setTimeout(() => {
          appendMessage(botReply, "bot");
          saveToStorage(botReply, "bot");
        }, 500);

        message.value = "";
      }

      message.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          response();
        }
      });

      loadHistory();
    </script>
  </body>
</html>
