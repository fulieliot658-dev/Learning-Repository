<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Number Guessing Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9eef5;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border: 2px solid #222;
      border-radius: 12px;
      box-shadow: 5px 5px 0 #222;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    .intro {
      margin-bottom: 25px;
      color: #555;
      line-height: 1.5;
    }

    .range {
      margin-bottom: 20px;
      padding: 10px;
      background: #f2f2f2;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 8px;
      text-align: left;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #555;
      border-radius: 6px;
      outline: none;
      font-size: 18px;
      text-align: center;
    }

    input:focus {
      border-color: #4444cc;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 2px solid #222;
      border-radius: 6px;
      background: #4444cc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3333aa;
    }

    .reset {
      background: #777;
    }

    .reset:hover {
      background: #555;
    }

    .message {
      min-height: 28px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .attempts {
      margin-top: 10px;
      color: #555;
    }

    .history {
      margin-top: 20px;
      padding: 12px;
      background: #fafafa;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: left;
    }

    .history h3 {
      margin-bottom: 8px;
    }

    #guesses {
      word-break: break-word;
      color: #444;
    }

    .win {
      color: green;
    }

    .high {
      color: #d35400;
    }

    .low {
      color: #8e44ad;
    }

    @media (max-width: 480px) {
      .game {
        padding: 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>Number Guessing Game</h1>

    <p class="intro">
      I have picked a number. Try to guess it!
    </p>

    <div class="range">
      Guess a number between 1 and 100
    </div>

    <label for="guess">Your Guess</label>

    <input
      type="number"
      id="guess"
      min="1"
      max="100"
      placeholder="Enter a number"
    >

    <button id="guessButton">
      Check Guess
    </button>

    <button class="reset" id="resetButton">
      New Game
    </button>

    <div class="message" id="message">
      Good luck!
    </div>

    <div class="attempts">
      Attempts: <span id="attempts">0</span>
    </div>

    <div class="history">
      <h3>Your guesses</h3>
      <div id="guesses">None yet</div>
    </div>

  </div>

  <script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    let guesses = [];

    const guessInput = document.getElementById("guess");
    const guessButton = document.getElementById("guessButton");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const attemptsDisplay = document.getElementById("attempts");
    const guessesDisplay = document.getElementById("guesses");

    function checkGuess() {
      const guess = Number(guessInput.value);

      if (guess === 0 || guess < 1 || guess > 100) {
        message.textContent = "Please enter a number from 1 to 100.";
        message.className = "message";
        return;
      }

      attempts++;
      guesses.push(guess);

      attemptsDisplay.textContent = attempts;
      guessesDisplay.textContent = guesses.join(", ");

      if (guess === secretNumber) {
        message.textContent =
          `Correct! The number was ${secretNumber}.`;
        message.className = "message win";
        guessButton.disabled = true;
        guessInput.disabled = true;
      }

      else if (guess > secretNumber) {
        message.textContent = "Too high! Try a smaller number.";
        message.className = "message high";
      }

      else {
        message.textContent = "Too low! Try a bigger number.";
        message.className = "message low";
      }

      guessInput.value = "";
      guessInput.focus();
    }

    function resetGame() {
      secretNumber = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      guesses = [];

      attemptsDisplay.textContent = "0";
      guessesDisplay.textContent = "None yet";

      message.textContent = "Good luck!";
      message.className = "message";

      guessInput.disabled = false;
      guessButton.disabled = false;
      guessInput.value = "";
      guessInput.focus();
    }

    guessButton.addEventListener("click", checkGuess);

    resetButton.addEventListener("click", resetGame);

    guessInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkGuess();
      }
    });
  </script>

</body>
</html>
