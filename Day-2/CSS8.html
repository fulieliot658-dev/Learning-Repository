1<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavy Text - Method 2</title>
  <style>body {
    background: #0f172a; /* Sleek dark theme */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.dynamic-wave span {
    font-family: sans-serif;
    font-size: 5rem;
    font-weight: 800;
    color: #00f2fe;
    display: inline-block;
    
    /* The browser calculates the delay using the --i variable generated by JS */
    animation: waveShift 0.5s ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * 0.08s);
}

@keyframes waveShift {
    0% {
        transform: translateY(0);
    }
    100% {
        transform: translateY(-30px);
        color: #4facfe; /* Colors shift fluidly as it lifts */
    }
}
</style>
</head>
<body>

    <!-- Write normal text here; JS handles the heavy lifting -->
    <h1 class="dynamic-wave">BOUNCING</h1>

    <script>const targetHeader = document.querySelector('.dynamic-wave');
const rawText = targetHeader.textContent;

// 1. Clear out the original solid text string
targetHeader.textContent = '';

// 2. Loop through every character in your word
rawText.split('').forEach((letter, index) => {
    const span = document.createElement('span');
    span.textContent = letter;
    
    // Inject the current position index straight into a CSS property variable
    span.style.setProperty('--i', index);
    
    // Pop the newly wrapped letter back inside our container header
    targetHeader.appendChild(span);
});
</script>
</body>
</html>
