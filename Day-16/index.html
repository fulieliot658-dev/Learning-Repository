// Clean async delay utility
const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function countDown(count1, count2) {
  await delay(2000); // Properly pauses execution for 2 seconds
  
  for (let i = 1; i <= count1; i++) {
    console.log(`ready ${i} counter:${count2}`);
  }

  for (let j = 1; j <= count1; j++) {
    console.log(`x value ${j} counter:${j}`);
  }
}

    <script>
      document.getElementById('nav-link').addEventListener('click', (event) => {
  event.preventDefault();

  // If you click the text "Go to Dashboard":
  console.log(event.target.id);        // "label" (the inner span)
  console.log(event.currentTarget.id); // "nav-link" (the actual anchor tag)

  // Reads "/dashboard" regardless of where inside the link you clicked
  const destination = event.currentTarget.getAttribute('href'); 
  console.log(`Navigating client-side to: ${destination}`);

  const anchor = event.target.closest('a');
  const router = {
  navigate(path) {
    window.history.pushState({}, '', path);
    console.log(`Navigated to ${path}`);
    // Update DOM view here
  }
};
  if (anchor) {
    // 1. Prevent native hard page reload
    event.preventDefault(); 
    
    // 2. Stop event from bubbling to outer window handlers
    event.stopPropagation(); 
    
    // 3. Extract path for JS pushState router
    const path = anchor.getAttribute('href'); 
    
    // 4. Pass path to client-side router
    router.navigate(path); 
  }
});
