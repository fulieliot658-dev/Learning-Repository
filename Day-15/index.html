    <body>
<div class="container">
</div>
<button type="submit"  class="Switch">Start</button>
<ul class="history"></ul>
<script>
      let time = document.querySelector(".container");
      let Switch = document.querySelector(".Switch");
      let hty = document.querySelector(".history");

      let timer = null;
      let lastStoppedTime = "";

      let record = JSON.parse(localStorage.getItem("recent")) || "";

      function renderHistory() {
        hty.innerHTML = "";
        record.forEach((item) => {
          let li = document.createElement("li");
          li.textContent = item;
          hty.appendChild(li);
        });
      }

      renderHistory();

      Switch.addEventListener("click", function clock() {
        let touch = time.classList.toggle("switch");

        if (touch) {
          Switch.textContent = "Stop";

          timer = setInterval(() => {
            let now = new Date().toLocaleTimeString(undefined, {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
            time.textContent = `${now}`;
            lastStoppedTime = now;
          }, 1000);

          console.log("yes");
        } else {
          clearInterval(timer);

          time.textContent = "Clock closed🚨";
          Switch.textContent = "Start";

          if (lastStoppedTime) {
            record.push(lastStoppedTime);
            localStorage.setItem("recent", JSON.stringify(record));

            let hist = document.createElement("li");
            hist.textContent = lastStoppedTime;
            hty.appendChild(hist);
          }

          console.log("No");
        }
      });
    </script>
