<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        @function --double(--value){
            result: calc(var(--value) * 2);
        }
        @function --glass(--value){
            result: var(blur((--value)-1));
        }
        html{
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        body{
            padding: 0;
            margin: 0;
            /* background: linear-gradient(to right, rgba(255, 60, 60, 0.932), rgba(176, 243, 255, 0.925)); */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .click{
            background-color: rgba(255, 255, 255, 0.062);
            backdrop-filter: ---glass(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 50%;
            height: auto;
            padding: --double(1em);
            transition: all 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
        }
        @starting-style{
            .click{
                color: var(--color(black));
            }
        }
        select{
            appearance: base-select;
            background-color: rgba(255, 255, 255, 0.062);
            backdrop-filter: ---glass(8px);
            border: 1px solid rgba(255, 255, 255, 0);
        }
        /* ::picker(option){
            background-color: rgba(255, 255, 255, 0.062);
            backdrop-filter: ---glass(8px);
            border: 1px solid rgba(255, 255, 255, 0);

        } */

    </style>
    <script type="text/javascript">
        // Your JavaScript code here
        function reveal(element){
        console.dir(element.nextElementSibling);
        }
        const {name, age}= {name: "Michael", age: 30};
        console.log(name, age);
        </script>
</head>
<body>
    <div class="sidebar">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
    </div>
    <div class="sidebar-button">

    </div>
    <select>
        <option value="greet">Greet</option>
        <option value="time">Time</option>
        <option value="date">Date</option>
    </select>
        <button type="submit" class="alert" onclick="message(this)">Alert</button>
        <button type="submit" class="alert" onclick="message(this)">Alert!</button>
    <span onclick="reveal(this)">Reveal</span>
    <div class="click" onclick="Switch()">Switch</div>
    <button class="num-btn">0</button><button class="num-btn">1</button><button class="num-btn">2</button>
    <input type="button" onclick="toggleTorch()" class="torch-btn" value="Torch"/>
    <input type="button" onclick="rainBow()" class="rainbow" value="Rainbow"/>
    <script>
        //
        let button = document.querySelector(".click");
        function Switch() {
            if(document.body.style.backgroundColor===""){
                button.textContent="Switch Again";
                document.body.style.backgroundColor="blue";
            } else {
                document.body.style.backgroundColor="";
                button.style.color="black";
                button.textContent="Switch";
            }
        }
        //
        const torch= document.querySelector(".torch-btn");
       function toggleTorch(){
         const isOn = torch.classList.toggle("On");
         if(isOn){
            document.body.style.backgroundColor="yellow";
         }
         else{
            document.body.style.backgroundColor="aliceblue";
         }
        }
        //
const buttons = document.querySelectorAll(".num-btn");

for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function() {
        console.log("Button index:", i);
    };
}
//
// document.querySelector(".alert").addEventListener("click", function() {
//     console.log("Alert button clicked!");
// }); 
//
function message(element){
console.log("Alert button clicked!", element);
console.dir(element.childNodes);
}
//
 setTimeout(function rainBow(){
    const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];
   for (let i = 0; i < colors.length; i++) {
        document.body.style.backgroundColor+=colors[i];
        i++;
    }}, 10000*i);
    </script>
</body>
</html>
