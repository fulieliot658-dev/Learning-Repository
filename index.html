function factorial(number){
    let answer= number;
    if (number===0){
        return answer =1;
    }
    else if(number<0){
        return '[WARN]: Not a Whole number, please change that value';
    }
    else{
    console.log(`[LOG]: ${answer}*=${factorial(number-1)}`);
        return  answer*=factorial(number-1);
    }
}
console.log(factorial(3));

    function countdown(start_val){

        if(start_val<1){
            return countdown();
        }
        else if(start_val>1){

        }

// A single function that handles ANY entity, as long as it has a draw() method
function renderScreen(entities) {
  for (let entity of entities) {
    entity.draw(); // It doesn't care WHAT it is, only that it can draw()
  }
}
