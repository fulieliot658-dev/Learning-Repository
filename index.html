function string_methods(string) {
    let filter_phrase = string.toLowerCase();
    let filter_str1 = filter_phrase.split("");
    
    // 1. Capitalize and re-assign the very first character
    filter_str1[0] = filter_str1[0].toUpperCase();
    
    // 2. Loop through the entire character array
    for (let l = 0; l < filter_str1.length; l++) {
        // Check if the current character is a space
        if (filter_str1[l] === " ") {
            // Capitalize the character right after the space
            filter_str1[l + 1] = filter_str1[l + 1].toUpperCase();
        }
    }
    
    // 3. Join the character array back together and return AFTER the loop completes
    return filter_str1.join("");
}

function string_methods(string) {
    // 3. Lowercase everything first
    let filter_phrase = string.toLowerCase();
    
    // 4. Empty array to hold converted words
    let capitalized_words = [];
    
    // 5. Split by space " " to get an array of words
    let words = filter_phrase.split(" ");
    
    // 6. Loop through each word using forEach
    words.forEach((word) => {
        // 7. Isolate 1st letter, uppercase it, then append the rest using slice()
        let formattedWord = word.slice(0, 1).toUpperCase() + word.slice(1);
        
        // 8. Add formatted word to array
        capitalized_words.push(formattedWord);
    });
    
    // 9 & 10. Join back into a space-separated string and return
    return capitalized_words.join(" ");
}

console.log(string_methods(phrase));
