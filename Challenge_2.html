<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <style>
  :root {
    --Blue_100: hsl(225, 100%, 94%);
    --Blue_700: hsl(245, 75%, 52%);
    --Blue_50: hsl(225, 100%, 98%);
    --Gray_600: hsl(224, 23%, 55%);
    --Gray_300: hsl(227, 100%, 95%);
    --Blue_950: hsl(223, 47%, 23%);
  }

  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--Blue_100);
  }

  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(18rem, 90%, 25rem);
    height: auto; /* Replaced invalid nested clamp */
    background-color: var(--Blue_50);
    border-radius: 15px;
    overflow: hidden; /* Clips image overflow to respect border-radius */
    padding-bottom: 2em; /* Bottom padding for content spacing */
    gap: 1.5em;
  }

  .large_img {
    width: 100%; /* Spans full width of the parent container */
    height: auto; /* Preserves aspect ratio */
    display: block; /* Removes unwanted bottom inline whitespace */
  }

  .description {
    color: var(--Gray_600);
    text-align: center;
    padding: 0 1.5em; /* Localized padding for text elements */
  }
  .title{
    text-align: center;
    font-weight: 700;
    font-size:x-large;
  }
.plan{
   display: flex;
   justify-content: space-between;
   align-items: center;
   gap: 7em;
   background-color: var(--Gray_300);
   border-radius: 10px;
   padding: 0.5em;
}
.label{
    display: flex;
   justify-content: space-between;
   align-items: center;
   gap: 1em;
}
a, .change{
    color: var(--Blue_700);
    font-weight: 600;
}
.cancel{
    text-decoration: none;
    color: var(--Gray_600);
}
</style>

<body>
  <div class="main-container">
    <img 
      src="C:\Users\Ayuketah\Downloads\order-summary-component-main\images\illustration-hero.svg" 
      alt="Podcast illustration" 
      class="large_img"
    >
    <span class="title">Order Summary</span>
    <p class="description">
      You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like.
    </p>
    <div class="plan">
      <span class="label">
        <img src="C:\Users\Ayuketah\Downloads\order-summary-component-main\images\icon-music.svg" alt="">
        <span class="plan-details">
          <p class="plan-title">Annual Plan</p>
          <span class="plan-price">$59.99/year</span>
        </span>
      </span> 
      <a href="#" class="change">Change</a>
    </div>
    <button class="purchase">Proceed to Payment</button>
    <a href="#" class="cancel">Cancel Order</a>
  </div>
</body>
